<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-gradient { background: linear-gradient(135deg, #1E3A5F 0%, #00C9B1 100%); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-[32px] shadow-2xl p-10 border border-slate-100">
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-gradient rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-lg shadow-teal-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <h1 class="text-3xl font-extrabold text-navy mb-2">Admin Portal</h1>
                <p class="text-slate-500 font-medium">Please sign in to manage your portfolio</p>
            </div>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="bg-red-50 text-red-600 px-4 py-3 rounded-xl mb-6 text-sm font-bold border border-red-100">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Username</label>
                    <input type="text" name="username" required class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-teal transition-all font-medium text-navy">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Password</label>
                    <input type="password" name="password" required class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4 focus:outline-none focus:border-teal transition-all font-medium text-navy">
                </div>
                <button type="submit" class="w-full bg-gradient text-white font-bold py-5 rounded-2xl shadow-xl shadow-teal-500/10 hover:shadow-teal-500/20 transition-all text-lg mt-4">
                    Sign In
                </button>
            </form>
            
            <div class="mt-8 text-center">
                <a href="{{ url_for('index') }}" class="text-sm font-bold text-slate-400 hover:text-teal transition-colors flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    Back to Website
                </a>
            </div>
        </div>
    </div>
</body>
</html>
