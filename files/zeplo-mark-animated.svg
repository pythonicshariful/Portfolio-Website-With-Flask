<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" font-family="Space Grotesk, DejaVu Sans, sans-serif"><style>
.cell {
  transform-box: fill-box;
  transform-origin: center;
  animation: draw 3.6s cubic-bezier(.22,1,.36,1) infinite;
  opacity: 0;
}
@keyframes draw {
  0%   { opacity: 0; transform: scale(.25); fill: #00E5B0; }
  3%   { opacity: 1; transform: scale(1.22); fill: #00E5B0; }
  8%   { opacity: 1; transform: scale(1);    fill: #5B3FF8; }
  78%  { opacity: 1; transform: scale(1);    fill: #5B3FF8; }
  86%  { opacity: 0; transform: scale(.25);  fill: #5B3FF8; }
  100% { opacity: 0; transform: scale(.25);  fill: #5B3FF8; }
}
.word { animation: rise 3.6s ease-out infinite; opacity: 0; }
@keyframes rise {
  0%,32%   { opacity: 0; transform: translateX(-14px); }
  42%      { opacity: 1; transform: translateX(0); }
  76%      { opacity: 1; transform: translateX(0); }
  84%,100% { opacity: 0; transform: translateX(0); }
}
.tag { animation: rise 3.6s ease-out infinite; animation-delay: .18s; opacity: 0;
        transform-box: fill-box; }
@media (prefers-reduced-motion: reduce) {
  .cell, .word, .tag { animation: none; opacity: 1; fill: #5B3FF8; }
}
